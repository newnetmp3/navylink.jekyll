name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Build with Jekyll
        run: bundle exec jekyll build
      - name: Setup Python for MyNavy sync tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MyNavy sync dependencies
        run: python -m pip install PyYAML==6.0.2 requests==2.32.5 beautifulsoup4==4.13.5
      - name: Verify MNP catalog parser and safe failure modes
        run: python -m unittest discover -s tools/tests -v
