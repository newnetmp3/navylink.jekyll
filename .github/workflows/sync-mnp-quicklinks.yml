name: Sync MyNavy Portal Quick Links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    paths:
      - 'tools/sync_mnp_quicklinks.py'
      - 'server/requirements.txt'
      - '.github/workflows/sync-mnp-quicklinks.yml'

permissions:
  contents: write

concurrency:
  group: sync-mnp-quicklinks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sync dependencies
        run: python -m pip install PyYAML==6.0.2 requests==2.32.5 beautifulsoup4==4.13.5

      - name: Sync full MNP Quick Links catalog
        run: python tools/sync_mnp_quicklinks.py --min-records 350

      - name: Show coverage audit
        run: cat _data/mnp_quick_links_meta.yml

      - name: Commit updated snapshot
        run: |
          git config user.name 'navylink-mnp-sync[bot]'
          git config user.email 'navylink-mnp-sync[bot]@users.noreply.github.com'
          git add _data/mnp_quick_links_generated.yml _data/mnp_quick_links_meta.yml
          if git diff --cached --quiet; then
            echo 'MNP Quick Links snapshot is already current.'
            exit 0
          fi
          git commit -m 'Refresh MyNavy Portal Quick Links snapshot'
          git push
